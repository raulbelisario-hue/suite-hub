name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Create Capacitor wrapper for Base44 URL
        run: |
          mkdir -p app-wrapper/www
          cd app-wrapper

          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Suite Hub</title>
            </head>
            <body style="background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
              Carregando Emporio Suite Hub...
            </body>
          </html>
          EOF

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.emporiosuitehub.app",
            "appName": "Emporio Suite Hub",
            "webDir": "www",
            "server": {
              "url": "https://emporiosuitehub.base44.app/",
              "cleartext": false,
              "allowNavigation": [
                "emporiosuitehub.base44.app",
                "*.base44.app"
              ]
            }
          }
          EOF

          npx cap add android
          npx cap sync android

          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }
              }
          }
          EOF

      - name: Assemble debug APK
        working-directory: app-wrapper/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suite-hub-debug-apk
          path: app-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
