name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Find project root and build web app
        run: |
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERRO: Nenhum package.json encontrado no repositorio."
            ls -la
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_PATH")
          echo "Projeto encontrado em: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          cd "$APP_DIR"
          npm install
          npm run build

      - name: Configure Capacitor and Android project
        run: |
          cd "$APP_DIR"
          npm install @capacitor/core @capacitor/cli @capacitor/android

          WEB_DIR="dist"
          if [ ! -d "$WEB_DIR" ] && [ -d "build" ]; then
            WEB_DIR="build"
          fi

          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Suite Hub" "com.emporiosuitehub.app" --web-dir="$WEB_DIR"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Assemble debug APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suite-hub-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
